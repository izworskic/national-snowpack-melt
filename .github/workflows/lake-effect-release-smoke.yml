name: Lake-effect release smoke
on:
  pull_request:
    paths:
      - ".github/workflows/lake-effect-release-smoke.yml"
      - "scripts/lake-effect-live-smoke.cjs"
      - "scripts/lake-effect-browser-smoke.cjs"
      - "lib/lake-effect.js"
      - "lib/lake-effect-observations.js"
      - "lib/lake-effect-station-validation.js"
      - "tests/lake-effect-observations.test.js"
      - "tests/lake-effect-stations.test.js"
      - "api/lake-effect.js"
      - "public/lake-effect-snow/**"
      - "public/assets/lake-effect.js"
      - "public/assets/lake-effect-explainer.js"
      - "public/assets/lake-effect-radar.js"
      - "public/assets/lake-effect-time-lens.js"
      - "public/assets/lake-effect-time-lens.css"
      - "tests/lake-effect-time-lens.test.js"
      - "tests/lake-effect-radar.test.js"
      - "tests/lake-effect-hardening.test.js"
      - "tests/lake-effect-history.test.js"
      - "tests/fixtures/lake-effect-history/**"
      - "lib/lake-effect-history-validation.js"
      - "scripts/benchmark-lake-effect-history.cjs"
      - "docs/LAKE_EFFECT_HISTORY_VALIDATION_2026.md"
      - "tests/lake-effect-explainer.test.js"
      - "lib/lake-effect-upper-air.js"
      - "tests/lake-effect-upper-air.test.js"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lake-effect-release-smoke
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run lake-effect unit and storm regression tests
        run: node --test tests/lake-effect*.test.js
      - name: Verify historical fixed-lead model proxy and NWS evidence provenance
        run: node scripts/benchmark-lake-effect-history.cjs --check
      - name: Verify official NOAA and NWS feeds
        run: node scripts/lake-effect-live-smoke.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.58.0
      - name: Test mobile and desktop browser UI
        run: |
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
          node scripts/lake-effect-browser-smoke.cjs
      - name: Preserve viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lake-effect-time-lens-viewports
          path: artifacts/lake-effect-lens/*.png
          if-no-files-found: ignore
          retention-days: 7
